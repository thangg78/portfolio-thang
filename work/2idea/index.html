<!doctype html>
<html lang="vi" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{idea.title}} · {{meta.title}}</title>
    <meta name="description" content="{{idea.summary}}" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Ảnh bìa là phần tử LCP của trang: nạp ngay, song song với CSS -->
    <link rel="preload" as="image" href="/work/2idea/cover.webp" imagesrcset="/work/2idea/cover-960.webp 960w, /work/2idea/cover.webp 1920w" imagesizes="(min-width: 1600px) 1520px, 100vw" fetchpriority="high" />
<script>document.documentElement.classList.replace('no-js', 'js');</script>
  </head>
  <body class="case zone-3" data-case="idea">
    <a class="skip-link" href="#main" data-i18n="nav.skip"></a>

    <header class="topbar">
      <button class="fx-toggle js-only" type="button" data-fx-toggle aria-pressed="false" data-i18n="nav.fxOff"></button>
      <button class="lang-toggle js-only" type="button" data-lang-toggle data-i18n="nav.lang" data-i18n-attr="aria-label:nav.langAria"></button>
    </header>

    <main id="main" class="case__main">
      <nav class="case__nav">
        <a class="case__back" href="/#tang-3" data-i18n="nav.back"></a>
      </nav>

      <header class="case__head">
        <p class="depth-tag"><span data-i18n="idea.depth"></span> · <span data-i18n="idea.tier"></span></p>
        <h1 class="case__title" data-i18n="idea.title"></h1>
        <p class="tier__kind" data-i18n="idea.kind"></p>
        <p class="case__summary" data-i18n="idea.summary"></p>
      </header>

      <figure class="case__cover">
        <img src="/work/2idea/cover.webp" srcset="/work/2idea/cover-960.webp 960w, /work/2idea/cover.webp 1920w" sizes="(min-width: 1600px) 1520px, 100vw" width="1920" height="1200" fetchpriority="high" decoding="async" data-cover="idea" data-i18n-attr="alt:idea.coverAlt" />
      </figure>

      <section class="case-sec" aria-labelledby="id-ctx">
        <h2 class="case-sec__label" id="id-ctx" data-i18n="labels.context"></h2>
        <div class="case-sec__body">
          <p class="case-sec__lead" data-i18n="idea.case.context"></p>
          <p><span class="case-sub" data-i18n="labels.scale"></span> <span data-i18n="idea.scale"></span></p>
        </div>
      </section>

      <section class="case-sec" aria-labelledby="id-role">
        <h2 class="case-sec__label" id="id-role" data-i18n="labels.role"></h2>
        <div class="case-sec__body">
          <p data-i18n="idea.role"></p>
        </div>
      </section>

      <section class="case-sec" aria-labelledby="id-method">
        <h2 class="case-sec__label" id="id-method" data-i18n="labels.method"></h2>
        <div class="case-sec__body">
          <ul class="steps" data-i18n-list="idea.method"></ul>
        </div>
      </section>

      <section class="case-sec" aria-labelledby="id-output">
        <h2 class="case-sec__label" id="id-output" data-i18n="labels.output"></h2>
        <div class="case-sec__body">
          <h3 class="case-sub" data-i18n="idea.case.highlightsTitle"></h3>
          <ul class="case-list" data-i18n-list="idea.case.highlights"></ul>
          <div class="case-shots">
            <figure class="strip">
              <div class="strip__frame" tabindex="0" role="region" data-i18n-attr="aria-label:idea.stripCap">
                <img src="/work/2idea/01-home-full.webp" width="960" height="4970" loading="lazy" decoding="async" data-i18n-attr="alt:idea.stripAlt" />
              </div>
              <figcaption data-i18n="idea.stripCap"></figcaption>
            </figure>
            <figure class="strip strip--mobile">
              <div class="strip__frame" tabindex="0" role="region" data-i18n-attr="aria-label:idea.case.mobileFullCap">
                <img src="/work/2idea/05-mobile-home-full.webp" width="390" height="6879" loading="lazy" decoding="async" data-i18n-attr="alt:idea.case.mobileFullAlt" />
              </div>
              <figcaption data-i18n="idea.case.mobileFullCap"></figcaption>
            </figure>
          </div>
          <figure class="case-wide">
            <img src="/work/2idea/02-qua-tet.webp" srcset="/work/2idea/02-qua-tet-960.webp 960w, /work/2idea/02-qua-tet.webp 1920w" sizes="(min-width: 1600px) 1520px, 100vw" width="1920" height="1555" loading="lazy" decoding="async" data-i18n-attr="alt:idea.case.tetAlt" />
            <figcaption data-i18n="idea.case.tetCap"></figcaption>
          </figure>
          <div class="case-gallery case-gallery--2">
            <figure>
              <img src="/work/2idea/03-chat-ai.webp" width="960" height="1080" loading="lazy" decoding="async" data-i18n-attr="alt:idea.case.chatAlt" />
              <figcaption data-i18n="idea.case.chatCap"></figcaption>
            </figure>
            <figure>
              <img src="/work/2idea/04-mobile.webp" width="1330" height="924" loading="lazy" decoding="async" data-i18n-attr="alt:idea.mobileAlt" />
              <figcaption data-i18n="idea.mobileCap"></figcaption>
            </figure>
          </div>
        </div>
      </section>

      <section class="case-sec" aria-labelledby="id-result">
        <h2 class="case-sec__label" id="id-result" data-i18n="labels.result"></h2>
        <div class="case-sec__body">
          <p class="case-sec__lead" data-i18n="idea.result"></p>
        </div>
      </section>

      <!--draft:idea-->
      <section class="case-sec" aria-labelledby="id-reflect">
        <h2 class="case-sec__label" id="id-reflect" data-i18n="labels.reflection"></h2>
        <div class="case-sec__body">
          <p data-i18n="idea.case.reflection"></p>
        </div>
      </section>
      <!--/draft:idea-->

      <footer class="case__end">
        <nav class="case__next">
          <a class="case__next-link" href="/#lien-he"><span class="depth-tag"><span data-i18n="nav.next"></span> · <span data-i18n="contact.depth"></span></span> <span class="case__next-title" data-i18n="contact.title"></span></a>
          <a class="case__back" href="/#tang-3" data-i18n="nav.back"></a>
        </nav>
      </footer>
    </main>

    <script type="module" src="/src/case.ts"></script>
  </body>
</html>
